<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantidade minima</title>
</head>
<body>

    <form id="formQTminima">
        <label for="nome">Informe o nome do seu produto:</label>
        <input type="text" id="nome">

        <br><br>

        <label for="qtMinima">Informe a quantidade mínima que esse produto deve possuir:</label>
        <input type="number" id="qtMinima">

        <br><br>

        <label for="quantidade">Informe a quantidade atual que o produto possui:</label>
        <input type="number" id="quantidade">

        <br><br>

        <button type="submit">Verificar</button>
    </form>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
